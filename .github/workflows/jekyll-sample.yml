name: Jekyll sample (build only)
on:
  push:
    branches: [migration/jekyll-markdown]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sample dependencies
        run: |
          cd migration/jekyll
          bundle install
      - name: Build migrated pages only
        run: |
          ruby migration/tools/validate.rb
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/migration/jekyll/Gemfile"
          bundle exec jekyll build --source migration/jekyll --destination .preview/jekyll-site --config migration/jekyll/_config.yml
      - name: Compare with current pages
        run: |
          npm install --prefix migration/tools --ignore-scripts
          node migration/tools/check.mjs
      - name: Verify shared profile updates both languages
        run: |
          cp -R migration/jekyll .preview/profile-source
          ruby -ryaml -e 'p=".preview/profile-source/_data/profile.yml"; d=YAML.load_file(p); d["email"]="sample-check@example.invalid"; d["cv"]="/files/CV_CHECK.pdf"; d["en"]["position"]="PROFILE_CHECK_EN"; d["zh"]["position"]="PROFILE_CHECK_ZH"; File.write(p,YAML.dump(d))'
          ruby -ryaml -e 'p=".preview/profile-source/_data/courses/ai-chip.yml"; d=YAML.load_file(p); d["en"]["title"]="COURSE_CHECK_EN"; d["zh"]["title"]="COURSE_CHECK_ZH"; File.write(p,YAML.dump(d))'
          ruby -ryaml -e 'p=Dir[".preview/profile-source/_papers/*.md"].first; _,front,body=File.read(p).split(/^---\s*$\n?/,3); d=YAML.safe_load(front); d["paper_id"]="migration-check-paper"; d["detail_url"]="/publication/migration-check-paper"; d["title"]="PAPER_CHECK_NEW"; d["order"]=9999; d["selected"]=true; d["selectedOrder"]=-9999; File.write(".preview/profile-source/_papers/migration-check-paper.md",YAML.dump(d)+"---\n\nA test abstract.\n")'
          ruby -ryaml -e 'File.write(".preview/profile-source/_news/migration-check-news.md",YAML.dump({"month"=>"2026.10","order"=>-9999,"english"=>"NEWS_CHECK_EN"})+"---\n\nNEWS_CHECK_ZH\n")'
          ruby -ryaml -e 'p=".preview/profile-source/_data/service.yml"; d=YAML.load_file(p); d["journals"]="SERVICE_CHECK"; File.write(p,YAML.dump(d))'
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/migration/jekyll/Gemfile"
          bundle exec jekyll build --source .preview/profile-source --destination .preview/profile-check --config .preview/profile-source/_config.yml
          node migration/tools/check-profile.mjs
      - name: Save sample output for local preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-sample
          path: .preview/jekyll-site
          retention-days: 7
