{% if page.lang == 'zh' %}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>{{ page_title | escape }} · {{ site.data.profile.name | escape }}</title>
    <meta name="description" content="{{ site.data.profile.name_zh | escape }} — {{ site.data.profile.zh.university | escape }}，计算机视觉与机器学习。">
    <link rel="canonical" href="{{ site.url }}{{ page.canonical_url | default: page.url }}">
    <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.english_url }}">
    <link rel="alternate" hreflang="zh-CN" href="{{ site.url }}{{ page.chinese_url }}">
    <link rel="icon" href="/images/favicon.ico">
    <meta name="theme-color" content="#2a5686">
    <link rel="stylesheet" href="/assets/css/reference/main.css">
    <link rel="stylesheet" href="/assets/css/reference/custom-theme.css">
    <link rel="stylesheet" href="/assets/css/scholar.css?v=37c1ff6939">
    <link rel="preload" href="/assets/fonts/source-sans3-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/typography.css?v=b63f895016">
    {% if page.section == 'teaching' %}<link rel="stylesheet" href="/assets/css/teaching.css?v=7983d50932">{% endif %}
    <script src="/assets/js/scholar.js?v=1485b84656" defer></script>

{% else %}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>{{ page_title | escape }} · {{ site.data.profile.name | escape }}</title>
    <meta name="description"
        content="{{ site.data.profile.name | escape }} — computer vision and machine learning, {{ site.data.profile.en.university | escape }}.">
    <link rel="canonical" href="{{ site.url }}{{ page.canonical_url | default: page.url }}">
    <link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.english_url }}">
    <link rel="alternate" hreflang="zh-CN" href="{{ site.url }}{{ page.chinese_url }}">
    <link rel="icon" href="/images/favicon.ico">
    <meta name="theme-color" content="#2a5686">
    <link rel="stylesheet" href="/assets/css/reference/main.css">
    <link rel="stylesheet" href="/assets/css/reference/custom-theme.css">
    <link rel="stylesheet" href="/assets/css/scholar.css?v=37c1ff6939">
    <link rel="preload" href="/assets/fonts/source-sans3-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/typography.css?v=b63f895016">
    {% if page.section == 'teaching' %}<link rel="stylesheet" href="/assets/css/teaching.css?v=7983d50932">{% endif %}
    <script src="/assets/js/scholar.js?v=1485b84656" defer></script>

{% endif %}
